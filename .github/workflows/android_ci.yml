name: Android CI Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install NDK
      run: |
        NDK_VER="28.2.13676358"
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;$NDK_VER"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh
        mkdir -p V2rayNG/app/libs
        cp -r libs/* V2rayNG/app/libs/

    - name: Cache Unified libv2ray
      id: cache-v2ray
      uses: actions/cache@v4
      with:
        path: V2rayNG/app/libs/libv2ray.aar
        key: ${{ runner.os }}-libv2ray-ci-${{ hashFiles('AndroidLibXrayLite/**/*.go', 'v2w-core/**/*.go', 'AndroidLibXrayLite/go.sum', 'v2w-core/go.sum') }}
    - name: Set up Go
      if: steps.cache-v2ray.outputs.cache-hit != 'true'
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build Unified libv2ray (Original Core + Scanner Core)
      if: steps.cache-v2ray.outputs.cache-hit != 'true'
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        gomobile init
        
        # Create a workspace to bind both modules together
        cat << 'EOF' > go.work
        go 1.23
        use (
          ./AndroidLibXrayLite
          ./v2w-core
        )
        EOF
        
        # Compile a single AAR containing both libv2ray and v2wscanner
        gomobile bind -v -androidapi 21 -target=android -o libv2ray.aar ./AndroidLibXrayLite ./v2w-core/v2wscanner
        
        # Move to libs
        mv libv2ray.aar V2rayNG/app/libs/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: V2rayNG

    - name: Run Android Lint
      run: ./gradlew lintFdroidDebug
      working-directory: V2rayNG
      continue-on-error: true

    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: V2rayNG/app/build/reports/lint-results-fdroidDebug.html

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      working-directory: V2rayNG
