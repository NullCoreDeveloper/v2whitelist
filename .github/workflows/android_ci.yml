name: Android CI Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install NDK
      run: |
        NDK_VER="28.2.13676358"
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;$NDK_VER"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh
        mkdir -p V2rayNG/app/libs
        cp -r libs/* V2rayNG/app/libs/

    - name: Fetch AndroidLibXrayLite tag
      id: xray_tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.12
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ steps.xray_tag.outputs.tag }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build libv2wcore (v2w-core scanner)
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init
        pushd v2w-core
        go get golang.org/x/mobile/bind
        gomobile bind -v -androidapi 21 -target=android -javapkg=com.kiktor.v2whitelist -o libv2wcore.aar ./v2wscanner
        popd
        cp v2w-core/libv2wcore.aar V2rayNG/app/libs/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: V2rayNG

    - name: Run Android Lint
      run: ./gradlew lintFdroidDebug
      working-directory: V2rayNG
      continue-on-error: true

    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: V2rayNG/app/build/reports/lint-results-fdroidDebug.html

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      working-directory: V2rayNG
