name: Android Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install NDK
      run: |
        NDK_VER="28.2.13676358"
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;$NDK_VER"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
        # Set ndkVersion in build.gradle.kts if needed, but it seems it works without it if we set ANDROID_NDK_HOME

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh
        mkdir -p V2rayNG/app/libs
        cp -r libs/* V2rayNG/app/libs/

    - name: Fetch AndroidLibXrayLite tag
      id: xray_tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.12
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ steps.xray_tag.outputs.tag }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Cache libv2wcore
      id: cache-v2wcore
      uses: actions/cache@v4
      with:
        path: v2w-core/libv2wcore.aar
        key: ${{ runner.os }}-v2wcore-${{ hashFiles('v2w-core/**/*.go', 'v2w-core/go.mod', 'v2w-core/go.sum') }}

    - name: Set up Go
      if: steps.cache-v2wcore.outputs.cache-hit != 'true'
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build libv2wcore (v2w-core scanner)
      if: steps.cache-v2wcore.outputs.cache-hit != 'true'
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init
        pushd v2w-core
        go get golang.org/x/mobile/bind
        gomobile bind -v -androidapi 21 -target=android -javapkg=com.kiktor.v2whitelist -o libv2wcore.aar ./v2wscanner
        popd

    - name: Copy libv2wcore to libs
      run: cp v2w-core/libv2wcore.aar V2rayNG/app/libs/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: V2rayNG

    - name: Decode Keystore
      run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > release.keystore
      working-directory: V2rayNG

    - name: Build with Gradle
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$PWD/release.keystore \
          -Pandroid.injected.signing.store.password=${{ secrets.RELEASE_KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.RELEASE_KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.RELEASE_KEY_PASSWORD }}
      working-directory: V2rayNG

    - name: Prepare Release Assets
      run: |
        mkdir -p release-apks
        find V2rayNG/app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} release-apks/ \;
        cd release-apks
        sha256sum *.apk > sha256sum.txt

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        files: |
          release-apks/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
