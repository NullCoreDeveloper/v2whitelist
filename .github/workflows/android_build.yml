name: Android Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install NDK
      run: |
        NDK_VER="28.2.13676358"
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;$NDK_VER"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
        # Set ndkVersion in build.gradle.kts if needed, but it seems it works without it if we set ANDROID_NDK_HOME

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh
        mkdir -p V2rayNG/app/libs
        cp -r libs/* V2rayNG/app/libs/

    - name: Cache Unified libv2ray
      id: cache-v2ray
      uses: actions/cache@v4
      with:
        path: V2rayNG/app/libs/libv2ray.aar
        key: ${{ runner.os }}-libv2ray-${{ hashFiles('AndroidLibXrayLite/**/*.go', 'v2w-core/**/*.go', 'AndroidLibXrayLite/go.sum', 'v2w-core/go.sum') }}
    - name: Set up Go
      if: steps.cache-v2ray.outputs.cache-hit != 'true'
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'

    - name: Build Unified libv2ray (Original Core + Scanner Core)
      if: steps.cache-v2ray.outputs.cache-hit != 'true'
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        gomobile init
        
        # Add tool directive required by Go 1.26+
        pushd AndroidLibXrayLite
        go get -tool golang.org/x/mobile/cmd/gobind
        popd
        
        pushd v2w-core
        go get -tool golang.org/x/mobile/cmd/gobind
        popd
        
        # Download all dependencies to populate the module cache
        pushd AndroidLibXrayLite && go mod download && popd
        pushd v2w-core && go mod download && popd
        
        # Patch anet to fix Go 1.26 incompatibility
        # net.zoneCache was removed in Go 1.26; the linkname trick no longer works.
        # The cache calls are not critical — interfaces still enumerate correctly.
        ANET_DIR="$(go env GOPATH)/pkg/mod/github.com/wlynxg/anet@v0.0.5"
        chmod -R u+w "$ANET_DIR" 2>/dev/null || true
        # Remove linkname declarations
        sed -i '/\/\/go:linkname zoneCache/d'   "$ANET_DIR/interface_android.go"
        sed -i '/var zoneCache ipv6ZoneCache/d'  "$ANET_DIR/interface_android.go"
        sed -i '/\/\/go:linkname zoneCacheX/d'  "$ANET_DIR/interface_android.go"
        sed -i '/var zoneCacheX ipv6ZoneCache/d' "$ANET_DIR/interface_android.go"
        # Remove calls to now-nonexistent variables
        sed -i '/zoneCache\.update/d'   "$ANET_DIR/interface_android.go"
        sed -i '/zoneCacheX\.update/d'  "$ANET_DIR/interface_android.go"
        
        # Create a workspace to bind both modules together
        cat << 'EOF' > go.work
        go 1.26
        use (
          ./AndroidLibXrayLite
          ./v2w-core
        )
        EOF
        
        # Compile a single AAR containing both libv2ray and v2wscanner
        gomobile bind -v -androidapi 21 -target=android -o libv2ray.aar ./AndroidLibXrayLite ./v2w-core/v2wscanner
        
        # Move to libs
        mv libv2ray.aar V2rayNG/app/libs/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: V2rayNG

    - name: Decode Keystore
      run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > release.keystore
      working-directory: V2rayNG

    - name: Build with Gradle
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$PWD/release.keystore \
          -Pandroid.injected.signing.store.password=${{ secrets.RELEASE_KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.RELEASE_KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.RELEASE_KEY_PASSWORD }}
      working-directory: V2rayNG

    - name: Prepare Release Assets
      run: |
        mkdir -p release-apks
        find V2rayNG/app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} release-apks/ \;
        cd release-apks
        sha256sum *.apk > sha256sum.txt

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        files: |
          release-apks/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
