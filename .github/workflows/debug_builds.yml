name: Debug Multiplatform Builds (v0.0.1)

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. Android Debug APK
  # =========================================================================
  build-android-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NDK
        run: |
          NDK_VER="28.2.13676358"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;$NDK_VER"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV

      - name: Build libhevtun
        run: |
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -r libs/* V2rayNG/app/libs/

      - name: Cache Unified libv2ray
        id: cache-v2ray
        uses: actions/cache@v4
        with:
          path: V2rayNG/app/libs/libv2ray.aar
          key: ${{ runner.os }}-libv2ray-debug-${{ hashFiles('AndroidLibXrayLite/**/*.go', 'v2w-core/**/*.go', 'AndroidLibXrayLite/go.sum', 'v2w-core/go.sum') }}

      - name: Set up Go
        if: steps.cache-v2ray.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build Unified libv2ray (Original Core + Scanner Core)
        if: steps.cache-v2ray.outputs.cache-hit != 'true'
        run: |
          export GOPROXY=https://proxy.golang.org,direct
          go install golang.org/x/mobile/cmd/gomobile@latest || (sleep 5 && go install golang.org/x/mobile/cmd/gomobile@latest)
          go install golang.org/x/mobile/cmd/gobind@latest || (sleep 5 && go install golang.org/x/mobile/cmd/gobind@latest)
          gomobile init
          
          # Patch anet to fix Go compatibility
          pushd AndroidLibXrayLite
          go mod download
          popd
          pushd v2w-core
          go mod download
          popd
          
          ANET_DIR="$(go env GOPATH)/pkg/mod/github.com/wlynxg/anet@v0.0.5"
          chmod -R u+w "$ANET_DIR" 2>/dev/null || true
          sed -i '/\/\/go:linkname zoneCache/d'   "$ANET_DIR/interface_android.go" || true
          sed -i '/var zoneCache ipv6ZoneCache/d'  "$ANET_DIR/interface_android.go" || true
          sed -i '/\/\/go:linkname zoneCacheX/d'  "$ANET_DIR/interface_android.go" || true
          sed -i '/var zoneCacheX ipv6ZoneCache/d' "$ANET_DIR/interface_android.go" || true
          sed -i '/zoneCache\.update/d'            "$ANET_DIR/interface_android.go" || true
          sed -i '/zoneCacheX\.update/d'           "$ANET_DIR/interface_android.go" || true
          
          if ! grep -q "RunV2WScanner" AndroidLibXrayLite/libv2ray_main.go; then
            sed -i '/mobasset "golang.org\/x\/mobile\/asset"/a \ \t"github.com/kiktor/v2w-core/v2wscanner"' AndroidLibXrayLite/libv2ray_main.go
            printf '\ntype V2WScanCallback interface {\n\tOnServerSuccess(configUrl string, delay int64)\n\tOnScanComplete(totalSuccess int64, totalFailed int64)\n}\n\nfunc RunV2WScanner(configs string, maxConcurrency int64, callback V2WScanCallback) {\n\tv2wscanner.RunV2WScanner(configs, maxConcurrency, callback)\n}\n\nfunc StopV2WScanner() {\n\tv2wscanner.StopV2WScanner()\n}\n' >> AndroidLibXrayLite/libv2ray_main.go
          fi
          
          pushd AndroidLibXrayLite
          V2W_ABS="$(readlink -f ../v2w-core)"
          go mod edit -require github.com/kiktor/v2w-core@v0.0.0
          go mod edit -replace "github.com/kiktor/v2w-core=$V2W_ABS"
          GOWORK=off go mod tidy
          GOWORK=off gomobile bind -v -target=android -androidapi 24 -trimpath \
            -ldflags='-s -w -buildid= -checklinkname=0' \
            -o ../V2rayNG/app/libs/libv2ray.aar \
            .
          popd

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: V2rayNG

      - name: Build Unsigned Debug APKs (v0.0.1.debug)
        run: |
          ./gradlew assembleFdroidDebug -PVERSION_NAME=0.0.1.debug -PversionName=0.0.1.debug --no-daemon --stacktrace
        working-directory: V2rayNG

      - name: Collect Android Artifacts
        run: |
          mkdir -p release-android-debug
          find V2rayNG/app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} release-android-debug/ \;
          cd release-android-debug
          ls -la
          sha256sum *.apk > sha256sum-android-debug.txt

      - name: Upload Android Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2whitelist-android-debug-v0.0.1
          path: release-android-debug/*
          retention-days: 14

  # =========================================================================
  # 2. Desktop Debug (Linux AppImage, Windows, macOS)
  # =========================================================================
  build-desktop-debug:
    name: Build Desktop Debug (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            platform: linux
            arch: amd64
            xray_asset: Xray-linux-64.zip
            tun2socks_asset: tun2socks-linux-amd64.zip
            binary_ext: ""
          - os: windows-latest
            os_name: Windows
            platform: windows
            arch: amd64
            xray_asset: Xray-windows-64.zip
            tun2socks_asset: tun2socks-windows-amd64.zip
            binary_ext: ".exe"
          - os: macos-latest
            os_name: macOS
            platform: darwin
            arch: arm64
            xray_asset: Xray-macos-arm64-v8a.zip
            tun2socks_asset: tun2socks-darwin-arm64.zip
            binary_ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build v2w-scan for ${{ matrix.os_name }}
        shell: bash
        run: |
          mkdir -p V2rayNG/desktopApp/bin
          pushd v2w-core
          CGO_ENABLED=0 GOOS=${{ matrix.platform }} GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags="-s -w" -o ../V2rayNG/desktopApp/bin/v2w-scan${{ matrix.binary_ext }} ./cmd/v2w-scan
          popd
          chmod +x V2rayNG/desktopApp/bin/* || true

      - name: Download Xray Core & GeoData
        shell: bash
        run: |
          mkdir -p V2rayNG/desktopApp/bin
          mkdir -p V2rayNG/desktopApp/assets
          
          XRAY_VER="v25.1.30"
          curl -sSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/${{ matrix.xray_asset }}"
          unzip -q xray.zip -d xray_tmp
          
          cp xray_tmp/xray${{ matrix.binary_ext }} V2rayNG/desktopApp/bin/
          cp xray_tmp/geoip.dat V2rayNG/desktopApp/assets/
          cp xray_tmp/geosite.dat V2rayNG/desktopApp/assets/
          
          rm -rf xray.zip xray_tmp
          chmod +x V2rayNG/desktopApp/bin/* || true

      - name: Download tun2socks & Wintun
        shell: bash
        run: |
          TUN2SOCKS_VER="v2.5.2"
          curl -sSL -o tun2socks.zip "https://github.com/xjasonlyu/tun2socks/releases/download/${TUN2SOCKS_VER}/${{ matrix.tun2socks_asset }}" || true
          if [ -f tun2socks.zip ]; then
            unzip -q tun2socks.zip -d tun2socks_tmp || true
            find tun2socks_tmp -name "tun2socks*" -type f -exec cp {} V2rayNG/desktopApp/bin/tun2socks${{ matrix.binary_ext }} \; || true
            rm -rf tun2socks.zip tun2socks_tmp
          fi

          if [ "${{ matrix.platform }}" == "windows" ]; then
            curl -sSL -o wintun.zip "https://www.wintun.net/builds/wintun-0.14.1.zip"
            unzip -q wintun.zip -d wintun_tmp
            cp wintun_tmp/wintun/bin/amd64/wintun.dll V2rayNG/desktopApp/bin/
            rm -rf wintun.zip wintun_tmp
          fi

          chmod +x V2rayNG/desktopApp/bin/* || true

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x V2rayNG/gradlew

      - name: Build Native Distribution Packages (v0.0.1)
        shell: bash
        run: |
          cd V2rayNG
          ./gradlew :desktopApp:packageDistributionForCurrentOS -PpackageVersion=0.0.1 --no-daemon --stacktrace

      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          APP_DIR="V2rayNG/desktopApp/build/compose/binaries/main/app/v2whitelist"
          mkdir -p "$APP_DIR/bin" "$APP_DIR/lib/app/resources/bin" "$APP_DIR/lib/app/resources/assets"
          cp -a V2rayNG/desktopApp/bin/* "$APP_DIR/bin/"
          cp -a V2rayNG/desktopApp/bin/* "$APP_DIR/lib/app/resources/bin/"
          cp -a V2rayNG/desktopApp/assets/*.dat "$APP_DIR/lib/app/resources/assets/"
          cp -a V2rayNG/desktopApp/assets/*.dat "$APP_DIR/lib/app/resources/"
          cp -a V2rayNG/desktopApp/src/desktopMain/resources/icon.png "$APP_DIR/lib/app/resources/"
          chmod +x "$APP_DIR/bin"/* "$APP_DIR/lib/app/resources/bin"/* || true
          
          BUILD_DIR="/tmp/appdir-build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cp -a "$APP_DIR"/* "$BUILD_DIR"/
          
          cat << 'EOF' > "$BUILD_DIR/AppRun"
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export APPDIR="${APPDIR:-$HERE}"
          export PATH="$HERE/bin:$PATH"
          exec "$HERE/bin/v2whitelist" "$@"
          EOF
          chmod +x "$BUILD_DIR/AppRun"
          
          cat << 'EOF' > "$BUILD_DIR/v2whitelist.desktop"
          [Desktop Entry]
          Type=Application
          Name=v2whitelist
          Exec=v2whitelist %u
          Icon=v2whitelist
          Categories=Network;
          Comment=ПроБел — v2whitelist Desktop Debug
          Terminal=false
          EOF
          
          cp V2rayNG/desktopApp/src/desktopMain/resources/icon.png "$BUILD_DIR/v2whitelist.png"
          ln -sf v2whitelist.png "$BUILD_DIR/.DirIcon"
          
          curl -sSL -o /tmp/appimagetool.AppImage "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool.AppImage
          cd /tmp && /tmp/appimagetool.AppImage --appimage-extract
          
          curl -sSL -o /tmp/runtime-x86_64 "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64"
          
          ARCH=x86_64 /tmp/squashfs-root/AppRun --no-appstream --runtime-file /tmp/runtime-x86_64 "$BUILD_DIR" "$GITHUB_WORKSPACE/V2rayNG/desktopApp/build/compose/binaries/main/v2whitelist-v0.0.1-linux-x86_64.AppImage"
          
          cd "$GITHUB_WORKSPACE/V2rayNG/desktopApp/build/compose/binaries/main"
          tar -czf v2whitelist-v0.0.1-linux-x86_64.tar.gz app/v2whitelist

      - name: Prepare Debug Artifacts
        shell: bash
        run: |
          mkdir -p release-desktop
          
          # Linux: AppImage, DEB и tar.gz
          if [ "${{ matrix.platform }}" == "linux" ]; then
            find V2rayNG/desktopApp/build/compose/binaries/main -name "*.AppImage" -exec cp {} release-desktop/ \;
            find V2rayNG/desktopApp/build/compose/binaries/main -name "*.deb" -exec cp {} release-desktop/ \;
            find V2rayNG/desktopApp/build/compose/binaries/main -name "*.tar.gz" -exec cp {} release-desktop/ \;
          fi
          
          # Windows: MSI и Portable ZIP
          if [ "${{ matrix.platform }}" == "windows" ]; then
            find V2rayNG/desktopApp/build/compose/binaries/main -name "*.msi" -exec cp {} release-desktop/ \;
              mkdir -p V2rayNG/desktopApp/build/compose/binaries/main/app/v2whitelist/bin
              mkdir -p V2rayNG/desktopApp/build/compose/binaries/main/app/v2whitelist/assets
              mkdir -p V2rayNG/desktopApp/build/compose/binaries/main/app/v2whitelist/data
              touch V2rayNG/desktopApp/build/compose/binaries/main/app/v2whitelist/.portable
              cp -a "$GITHUB_WORKSPACE/V2rayNG/desktopApp/bin"/* V2rayNG/desktopApp/build/compose/binaries/main/app/v2whitelist/bin/ || true
              cp -a "$GITHUB_WORKSPACE/V2rayNG/desktopApp/assets"/* V2rayNG/desktopApp/build/compose/binaries/main/app/v2whitelist/assets/ || true
              pushd V2rayNG/desktopApp/build/compose/binaries/main/app
              zip -r "$GITHUB_WORKSPACE/release-desktop/v2whitelist-v0.0.1-windows-x64-portable.zip" v2whitelist
              popd
            fi
          fi
          
          # macOS: DMG и PKG
          if [ "${{ matrix.platform }}" == "darwin" ]; then
            find V2rayNG/desktopApp/build/compose/binaries/main -name "*.dmg" -exec cp {} release-desktop/ \;
            find V2rayNG/desktopApp/build/compose/binaries/main -name "*.pkg" -exec cp {} release-desktop/ \;
          fi

          cd release-desktop
          ls -la
          sha256sum * > sha256sum-${{ matrix.platform }}-${{ matrix.arch }}.txt || true

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2whitelist-${{ matrix.os_name }}-debug-v0.0.1
          path: release-desktop/*
          retention-days: 14
