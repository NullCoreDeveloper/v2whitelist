name: Desktop Multiplatform Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            platform: linux
            arch: amd64
            xray_asset: Xray-linux-64.zip
            tun2socks_asset: tun2socks-linux-amd64.zip
            binary_ext: ""
          - os: windows-latest
            os_name: Windows
            platform: windows
            arch: amd64
            xray_asset: Xray-windows-64.zip
            tun2socks_asset: tun2socks-windows-amd64.zip
            binary_ext: ".exe"
          - os: macos-latest
            os_name: macOS
            platform: darwin
            arch: arm64
            xray_asset: Xray-macos-arm64-v8a.zip
            tun2socks_asset: tun2socks-darwin-arm64.zip
            binary_ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.0.0-dev"
          fi
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Тег '$TAG' не соответствует формату vX.Y.Z[-суффикс]"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Версия сборки: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build v2w-scan and v2w-service for ${{ matrix.os_name }}
        shell: bash
        run: |
          mkdir -p V2rayNG/desktopApp/bin
          pushd v2w-core
          CGO_ENABLED=0 GOOS=${{ matrix.platform }} GOARCH=${{ matrix.arch }} \
            go build -trimpath -tags "netgo osusergo" -ldflags="-s -w -extldflags '-static'" -o ../V2rayNG/desktopApp/bin/v2w-scan${{ matrix.binary_ext }} ./cmd/v2w-scan
          if [ "${{ matrix.platform }}" == "windows" ]; then
            echo "Компиляция фоновой системной службы Windows v2w-service..."
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
              go build -trimpath -tags "netgo osusergo" -ldflags="-s -w -extldflags '-static'" -o ../V2rayNG/desktopApp/bin/v2w-service.exe ./cmd/v2w-service
          fi
          popd
          chmod +x V2rayNG/desktopApp/bin/* || true

      - name: Download Xray Core & GeoData
        shell: bash
        run: |
          mkdir -p V2rayNG/desktopApp/bin
          mkdir -p V2rayNG/desktopApp/assets
          
          XRAY_VER="v26.10.31"
          curl -sSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/${{ matrix.xray_asset }}"
          unzip -q xray.zip -d xray_tmp
          
          # Копируем бинарник xray
          cp xray_tmp/xray${{ matrix.binary_ext }} V2rayNG/desktopApp/bin/
          # Копируем гео-базы в assets и в bin (для прямого поиска ядром Xray)
          cp xray_tmp/geoip.dat V2rayNG/desktopApp/assets/
          cp xray_tmp/geosite.dat V2rayNG/desktopApp/assets/
          cp xray_tmp/geoip.dat V2rayNG/desktopApp/bin/
          cp xray_tmp/geosite.dat V2rayNG/desktopApp/bin/
          
          rm -rf xray.zip xray_tmp
          chmod +x V2rayNG/desktopApp/bin/* || true

      - name: Download tun2socks & Wintun (Windows)
        shell: bash
        run: |
          TUN2SOCKS_VER="v2.5.2"
          curl -sSL -o tun2socks.zip "https://github.com/xjasonlyu/tun2socks/releases/download/${TUN2SOCKS_VER}/${{ matrix.tun2socks_asset }}" || true
          if [ -f tun2socks.zip ]; then
            unzip -q tun2socks.zip -d tun2socks_tmp || true
            find tun2socks_tmp -name "tun2socks*" -type f -exec cp {} V2rayNG/desktopApp/bin/tun2socks${{ matrix.binary_ext }} \; || true
            rm -rf tun2socks.zip tun2socks_tmp
          fi

          if [ "${{ matrix.platform }}" == "windows" ]; then
            # Скачиваем Wintun драйвер для Windows TUN режима
            curl -sSL -o wintun.zip "https://www.wintun.net/builds/wintun-0.14.1.zip"
            unzip -q wintun.zip -d wintun_tmp
            cp wintun_tmp/wintun/bin/amd64/wintun.dll V2rayNG/desktopApp/bin/
            rm -rf wintun.zip wintun_tmp
          fi

          chmod +x V2rayNG/desktopApp/bin/* || true

      - name: Prepare Package Resources
        shell: bash
        run: |
          mkdir -p V2rayNG/desktopApp/package-resources/common/bin V2rayNG/desktopApp/package-resources/common/assets
          cp -a V2rayNG/desktopApp/bin/* V2rayNG/desktopApp/package-resources/common/bin/ || true
          cp -a V2rayNG/desktopApp/assets/* V2rayNG/desktopApp/package-resources/common/assets/ || true
          mkdir -p V2rayNG/desktopApp/package-resources/windows-x64/bin
          cp -a V2rayNG/desktopApp/bin/* V2rayNG/desktopApp/package-resources/windows-x64/bin/ || true

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x V2rayNG/gradlew

      - name: Build Native Distribution Packages
        shell: bash
        run: |
          cd V2rayNG
          ./gradlew :desktopApp:createDistributable -PVERSION_NAME=$VERSION --no-daemon --stacktrace

          # Предварительное наполнение каталогов дистрибутива bin и assets ДО упаковки в MSI / инсталлятор
          APP_DIR=$(find desktopApp/build/compose/binaries/main/app -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
            echo "Предварительное наполнение каталога приложения $APP_DIR..."
            mkdir -p "$APP_DIR/bin" "$APP_DIR/assets" "$APP_DIR/app/resources/bin" "$APP_DIR/app/resources/assets" "$APP_DIR/resources/bin" "$APP_DIR/resources/assets"
            cp -a desktopApp/bin/* "$APP_DIR/bin/" || true
            cp -a desktopApp/assets/* "$APP_DIR/assets/" || true
            cp -a desktopApp/bin/* "$APP_DIR/app/resources/bin/" || true
            cp -a desktopApp/assets/* "$APP_DIR/app/resources/assets/" || true
            cp -a desktopApp/bin/* "$APP_DIR/resources/bin/" || true
            cp -a desktopApp/assets/* "$APP_DIR/resources/assets/" || true
          fi

          # Windows: вшиваем манифест asInvoker в v2whitelist.exe для корректных метаданных
          if [ "${{ matrix.platform }}" == "windows" ]; then
            echo "Поиск mt.exe для интеграции манифеста..."
            MT_BIN="mt.exe"
            if ! command -v mt.exe >/dev/null 2>&1; then
              FOUND_MT=$(find "C:/Program Files (x86)/Windows Kits" -name "mt.exe" 2>/dev/null | grep "/x64/mt.exe" | head -n 1)
              if [ -n "$FOUND_MT" ]; then
                MT_BIN="$FOUND_MT"
              fi
            fi
            MANIFEST_PATH="$GITHUB_WORKSPACE/V2rayNG/desktopApp/src/desktopMain/resources/windows/app.manifest"
            for EXE in $(find desktopApp/build/compose/binaries/main/app -name "v2whitelist.exe"); do
              echo "Интеграция манифеста в $EXE..."
              "$MT_BIN" -manifest "$MANIFEST_PATH" -outputresource:"$EXE;#1" || true
            done
          fi

          ./gradlew :desktopApp:packageDistributionForCurrentOS -PVERSION_NAME=$VERSION --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        shell: bash
        run: |
          mkdir -p release-desktop
          
          # Linux: AppImage и DEB
          if [ "${{ matrix.platform }}" == "linux" ]; then
            find V2rayNG/desktopApp/build/compose/binaries/main -name "*.AppImage" -exec cp {} release-desktop/ \;
            find V2rayNG/desktopApp/build/compose/binaries/main -name "*.deb" -exec cp {} release-desktop/ \;
          fi
          
          # Windows: MSI и Portable ZIP
          if [ "${{ matrix.platform }}" == "windows" ]; then
            find V2rayNG/desktopApp/build/compose/binaries/main -name "*.msi" -exec cp {} release-desktop/ \;
            APP_DIR="V2rayNG/desktopApp/build/compose/binaries/main/app/v2whitelist"
            if [ ! -d "$APP_DIR" ]; then
              FOUND_DIR=$(find V2rayNG/desktopApp/build/compose/binaries/main/app -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -n "$FOUND_DIR" ]; then
                APP_DIR="$FOUND_DIR"
              fi
            fi
            echo "Используется APP_DIR для портативной сборки: $APP_DIR"
            mkdir -p "$APP_DIR/bin"
            mkdir -p "$APP_DIR/assets"
            mkdir -p "$APP_DIR/data"
            mkdir -p "$APP_DIR/app/resources/bin"
            mkdir -p "$APP_DIR/app/resources/assets"
            touch "$APP_DIR/.portable"

            # Генерация скриптов установки и удаления службы Windows для портативной версии
            cat << 'EOF' > "$APP_DIR/install_service.bat"
            @echo off
            chcp 65001 >nul
            echo ========================================================
            echo   Установка системной службы ProBel (v2w-service)
            echo ========================================================
            echo.
            net session >nul 2>&1
            if %errorLevel% neq 0 (
                echo [i] Требуются права администратора для регистрации службы Windows.
                echo [i] Запрашиваем повышение привилегий UAC...
                powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath '%~f0' -Verb RunAs"
                exit /b
            )
            set "BIN=%~dp0bin\v2w-service.exe"
            if not exist "%BIN%" set "BIN=%~dp0app\resources\bin\v2w-service.exe"
            if not exist "%BIN%" set "BIN=%~dp0v2w-service.exe"
            if not exist "%BIN%" (
                echo [!] Ошибка: v2w-service.exe не найден.
                pause
                exit /b 1
            )
            echo [*] Установка и запуск службы: "%BIN%"
            "%BIN%" -install
            if %errorLevel% equ 0 (
                echo.
                echo [+] Служба ProBel VPN Service успешно установлена и запущена!
                echo [+] Теперь приложение можно запускать без прав администратора.
            ) else (
                echo.
                echo [!] Ошибка установки службы (код: %errorLevel%).
            )
            echo.
            pause
            EOF

            cat << 'EOF' > "$APP_DIR/uninstall_service.bat"
            @echo off
            chcp 65001 >nul
            echo ========================================================
            echo   Удаление системной службы ProBel (v2w-service)
            echo ========================================================
            echo.
            net session >nul 2>&1
            if %errorLevel% neq 0 (
                echo [i] Требуются права администратора для удаления службы Windows.
                echo [i] Запрашиваем повышение привилегий UAC...
                powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath '%~f0' -Verb RunAs"
                exit /b
            )
            set "BIN=%~dp0bin\v2w-service.exe"
            if not exist "%BIN%" set "BIN=%~dp0app\resources\bin\v2w-service.exe"
            if not exist "%BIN%" set "BIN=%~dp0v2w-service.exe"
            if not exist "%BIN%" (
                echo [*] Попытка остановить и удалить через sc.exe...
                sc stop v2w-service >nul 2>&1
                sc delete v2w-service >nul 2>&1
                echo [+] Служба удалена из системы.
                pause
                exit /b 0
            )
            echo [*] Остановка и удаление службы...
            "%BIN%" -uninstall
            echo.
            echo [+] Служба ProBel VPN Service успешно удалена из системы.
            echo.
            pause
            EOF

            cp -a "$GITHUB_WORKSPACE/V2rayNG/desktopApp/bin"/* "$APP_DIR/bin/" || true
            cp -a "$GITHUB_WORKSPACE/V2rayNG/desktopApp/assets"/* "$APP_DIR/assets/" || true
            cp -a "$GITHUB_WORKSPACE/V2rayNG/desktopApp/bin"/* "$APP_DIR/app/resources/bin/" || true
            cp -a "$GITHUB_WORKSPACE/V2rayNG/desktopApp/assets"/* "$APP_DIR/app/resources/assets/" || true
            pushd "$(dirname "$APP_DIR")"
            TARGET_FOLDER="$(basename "$APP_DIR")"
            if command -v 7z >/dev/null 2>&1; then
              7z a -tzip "$GITHUB_WORKSPACE/release-desktop/v2whitelist-${VERSION}-windows-x64-portable.zip" "$TARGET_FOLDER"
            elif command -v zip >/dev/null 2>&1; then
              zip -r "$GITHUB_WORKSPACE/release-desktop/v2whitelist-${VERSION}-windows-x64-portable.zip" "$TARGET_FOLDER"
            else
              python3 -m zipfile -c "$GITHUB_WORKSPACE/release-desktop/v2whitelist-${VERSION}-windows-x64-portable.zip" "$TARGET_FOLDER" || python -m zipfile -c "$GITHUB_WORKSPACE/release-desktop/v2whitelist-${VERSION}-windows-x64-portable.zip" "$TARGET_FOLDER"
            fi
            popd
          fi
          
          # macOS: DMG и PKG
          if [ "${{ matrix.platform }}" == "darwin" ]; then
            find V2rayNG/desktopApp/build/compose/binaries/main -name "*.dmg" -exec cp {} release-desktop/ \;
            find V2rayNG/desktopApp/build/compose/binaries/main -name "*.pkg" -exec cp {} release-desktop/ \;
          fi

          cd release-desktop
          ls -la
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > sha256sum-${{ matrix.platform }}-${{ matrix.arch }}.txt || true
          else
            shasum -a 256 * > sha256sum-${{ matrix.platform }}-${{ matrix.arch }}.txt || true
          fi

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: true
          files: |
            release-desktop/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
